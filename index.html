<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DESAFIO CONTROLE DA PRODUÇÃO</title></head><body><p style="font-family:Arial;text-align:center">Carregando o desafio...</p><script>Promise.all(['game1.txt','game2.txt'].map(u=>fetch(u).then(r=>{if(!r.ok)throw Error('Falha ao carregar '+u);return r.text()}))).then(p=>{document.open();document.write(p.join(''));document.close()}).catch(e=>{document.body.innerHTML='<p style="font-family:Arial;text-align:center;color:#b00">Não foi possível carregar o jogo. Atualize a página.</p>';console.error(e)});</script></body></html>
