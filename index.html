<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DESAFIO CONTROLE DA PRODUÇÃO</title><style>*{box-sizing:border-box}body{margin:0;font-family:Segoe UI,Arial,sans-serif;background:#07152f;color:#f8fafc;min-height:100vh;display:grid;place-items:center;padding:16px}.app{width:min(820px,100%);background:#0d1f3e;border:1px solid #334155;border-radius:18px;overflow:hidden;box-shadow:0 20px 55px #0008}header{padding:18px 24px;background:linear-gradient(135deg,#063b96,#0b75d1,#1687e8);display:flex;justify-content:space-between;gap:16px;align-items:center}.title{font-size:22px;font-weight:900}.sub{font-size:13px;color:#dbeafe;margin-top:3px}.hud{display:flex;gap:8px}.hud b{display:block;color:#fbbf24;font-size:18px}.hud span{font-size:10px;color:#cbd5e1;text-transform:uppercase}.bar{height:6px;background:#020817}.fill{height:100%;width:0;background:linear-gradient(90deg,#22d3ee,#fbbf24,#ff6b00);transition:.3s}.content{padding:24px}.screen{display:none}.screen.active{display:block}.card{background:#0f172a;border:1px solid #334155;border-radius:14px;padding:18px;margin:14px 0}.hero{text-align:center;padding:34px 20px}.hero h2{font-size:30px;margin:0 0 10px}.hero p{color:#cbd5e1;line-height:1.55}.input{width:100%;padding:14px;border:2px solid #475569;border-radius:10px;background:#07152f;color:white;font-size:17px}.btn{width:100%;padding:14px;border:0;border-radius:10px;background:linear-gradient(135deg,#2563eb,#1d4ed8);color:white;font-weight:900;font-size:16px;cursor:pointer;margin-top:12px}.tag{display:inline-block;background:#0284c7;border-radius:7px;padding:5px 9px;font-size:11px;font-weight:800}.stage{font-size:23px;font-weight:900;margin:8px 0}.question{font-size:18px;font-weight:800;margin-bottom:8px}.desc{color:#dbeafe;line-height:1.55}.scene{height:230px;border-radius:14px;background:linear-gradient(135deg,#eef7ff,#fff,#fff5e8);border:2px solid #38bdf866;display:grid;place-items:center;overflow:hidden}.scene svg{width:96%;height:96%}.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:15px}.opt{padding:15px;text-align:left;border-radius:10px;border:2px solid #334155;background:linear-gradient(145deg,#20385f,#172d50);color:white;font-weight:800;cursor:pointer}.opt:hover{border-color:#60a5fa}.correct{border-color:#34d399!important;background:#14532d!important}.wrong{border-color:#fb7185!important;background:#4c0519!important}.feedback{margin-top:12px;padding:12px;border-radius:10px;font-weight:800}.ok{background:#064e3b;color:#86efac;border:1px solid #34d399}.bad{background:#4c0519;color:#fda4af;border:1px solid #fb7185}.rank{background:#0f172a;border:1px solid #334155;border-radius:12px;padding:12px}.row{display:grid;grid-template-columns:35px 1fr 90px 70px;gap:8px;padding:8px 4px;border-bottom:1px solid #334155}.effect{position:fixed;inset:0;display:grid;place-items:center;pointer-events:none;opacity:0;z-index:5}.effect.show{animation:flash .8s ease}.circle{width:180px;height:180px;border-radius:50%;display:grid;place-items:center;transform:scale(.4);font-size:100px;box-shadow:0 20px 60px #0007}.effect.show .circle{animation:pop .7s cubic-bezier(.17,.89,.32,1.35) forwards}.good .circle{background:#16b866}.badfx .circle{background:#ef3340}@keyframes pop{0%{transform:scale(.4)}55%{transform:scale(1.12)}100%{transform:scale(1)}}@keyframes flash{0%{opacity:0}15%{opacity:1}75%{opacity:1}100%{opacity:0}}@media(max-width:600px){header{align-items:flex-start;flex-direction:column}.opts{grid-template-columns:1fr}.row{grid-template-columns:30px 1fr 70px 55px}.content{padding:16px}}</style></head><body><div class="app"><header><div><div class="title">DESAFIO CONTROLE DA PRODUÇÃO</div><div class="sub">SENAI • Desafio gamificado</div></div><div class="hud"><div><span>Jogador</span><b id="player">—</b></div><div><span>Pontos</span><b id="score">0</b></div><div><span>Tempo</span><b id="time">00:00</b></div></div></header><div class="bar"><div id="fill" class="fill"></div></div><main class="content"><section id="start" class="screen active hero"><h2>Controle da Produção</h2><p>Identifique o arranjo físico e os sistemas de produção apresentados em cada situação. Responda com rapidez e acumule pontos.</p><form id="form"><input id="name" class="input" placeholder="Digite seu nome" maxlength="40" required><button class="btn">INICIAR DESAFIO</button></form></section><section id="game" class="screen"><div><span id="badge" class="tag"></span><span id="type" class="tag"></span></div><div id="stage" class="stage"></div><div class="card"><div id="qlabel" class="question"></div><div id="desc" class="desc"></div></div><div id="scene" class="scene"></div><div id="opts" class="opts"></div><div id="fb" class="feedback" style="display:none"></div><button id="next" class="btn" style="display:none">PRÓXIMA SITUAÇÃO</button></section><section id="end" class="screen hero"><h2>Desafio concluído!</h2><p id="winner"></p><div class="card"><p>Tempo: <b id="ft"></b></p><p>Erros: <b id="fm"></b></p><p>Pontuação: <b id="fs" style="color:#fbbf24"></b></p></div><div class="rank"><h3>Ranking</h3><div id="ranking"></div></div><button id="again" class="btn">JOGAR NOVAMENTE</button></section></main></div><div id="fx" class="effect"><div id="fxc" class="circle"></div></div><script>const Q=[['Hospital','Arranjo Físico','Em um centro cirúrgico, a equipe, os equipamentos e os materiais são posicionados ao redor do paciente, que permanece no local durante o atendimento.','Posicional','O produto ou paciente permanece em posição fixa e os recursos se deslocam até ele.','hospital'],['Hipermercado','Arranjo Físico','Um hipermercado organiza seus setores por funções: açougue, padaria, hortifrúti, bebidas e limpeza, permitindo diferentes percursos de compra.','Funcional','No arranjo funcional, recursos semelhantes são agrupados por função ou processo.','market'],['Centro oncológico','Arranjo Físico','Em um centro oncológico, pacientes com necessidades semelhantes seguem uma sequência de etapas e são atendidos em uma estrutura organizada por grupos de atendimento.','Celular','O arranjo celular reúne recursos para atender uma família ou grupo de produtos com fluxo próprio.','cell'],['Drive-thru','Arranjo Físico','Em um drive-thru de alimentação rápida, o pedido segue uma sequência definida de preparação, montagem e entrega, com fluxo contínuo de clientes e produtos.','Por Produto / Linha','O arranjo por produto organiza os recursos segundo a sequência de fabricação ou atendimento.','line'],['Estaleiro','Arranjo Físico','Na construção de um navio, a grande estrutura permanece em uma área enquanto equipes, materiais, ferramentas e equipamentos se deslocam até ela.','Posicional','Em produtos muito grandes ou difíceis de mover, o produto fica parado e os recursos vão até ele.','ship'],['Fábrica de motores','Arranjo Físico','Uma fábrica organiza máquinas em formato de U para produzir uma família de motores, reduzindo deslocamentos e facilitando o fluxo da equipe.','Celular','A célula produtiva agrupa recursos para uma família de produtos e favorece um fluxo integrado.','u'],['Produção em lotes','Sistema de Produção','Uma fábrica produz 500 peças de um modelo, depois interrompe o processo para preparar máquinas e fabricar outro modelo em quantidade definida.','Produção por Lote','A produção ocorre em quantidades determinadas antes da troca para outro produto ou lote.','batch'],['Grandes lotes','Sistema de Produção','Uma indústria fabrica grandes quantidades de produtos padronizados antes de realizar uma nova preparação das máquinas para outro lote.','Produção por Lote','A característica central é fabricar uma quantidade definida e depois mudar o lote ou a programação.','batch2'],['Pedido específico','Sistema de Produção','Uma empresa recebe o pedido de um cliente para criar um produto específico, adaptado às suas medidas, características e preferências.','Produção por Encomenda','O produto é produzido para atender a uma demanda específica do cliente.','custom'],['Processo contínuo','Sistema de Produção','Uma indústria opera um processo que não pode ou não deve parar. A produção segue continuamente durante o período de operação.','Produção Contínua','A produção contínua mantém o processo funcionando de forma constante, com paradas apenas quando necessárias ou programadas.','continuous']];let i=0,score=0,mistakes=0,startAt=0,total=0,timer,player='',players=[];function screen(id){document.querySelectorAll('.screen').forEach(x=>x.classList.remove('active'));document.getElementById(id).classList.add('active')}function timefmt(s){return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}function svg(type){let c={hospital:['#e0f2fe','#0ea5e9','H'],market:['#fef3c7','#f59e0b','M'],cell:['#dcfce7','#22c55e','C'],line:['#ffedd5','#f97316','→'],ship:['#dbeafe','#2563eb','S'],u:['#ede9fe','#8b5cf6','U'],batch:['#dbeafe','#0284c7','B'],batch2:['#fef3c7','#f59e0b','B'],custom:['#fce7f3','#db2777','P'],continuous:['#dcfce7','#16a34a','∞']}[type];return `<svg viewBox="0 0 700 220"><rect x="12" y="12" width="676" height="196" rx="22" fill="${c[0]}"/><circle cx="350" cy="110" r="72" fill="${c[1]}" opacity=".92"/><text x="350" y="132" text-anchor="middle" font-size="72" font-weight="900" fill="white">${c[2]}</text><path d="M70 170H630" stroke="${c[1]}" stroke-width="10" stroke-linecap="round" opacity=".35"/><circle cx="120" cy="170" r="13" fill="${c[1]}"/><circle cx="580" cy="170" r="13" fill="${c[1]}"/></svg>`}function render(){let q=Q[i];document.getElementById('badge').textContent=`Situação ${i+1} de ${Q.length}`;document.getElementById('type').textContent=q[1];document.getElementById('stage').textContent=q[0];document.getElementById('qlabel').textContent=q[1]==='Sistema de Produção'?'Qual é o sistema de produção apresentado nesta situação?':'Qual é o tipo de arranjo físico presente neste ambiente?';document.getElementById('desc').textContent=q[2];document.getElementById('scene').innerHTML=svg(q[5]);let opts=q[1]==='Sistema de Produção'?['Produção por Lote','Produção Contínua','Produção por Encomenda','Produção Individual']:shuffle(['Funcional','Celular','Posicional','Por Produto / Linha']);document.getElementById('opts').innerHTML='';opts.forEach((x,n)=>{let b=document.createElement('button');b.className='opt';b.textContent=String.fromCharCode(65+n)+') '+x;b.onclick=()=>answer(b,x===q[3]);document.getElementById('opts').appendChild(b)});document.getElementById('fb').style.display='none';document.getElementById('next').style.display='none';document.getElementById('fill').style.width=(i/Q.length*100)+'%';startAt=Date.now()}function shuffle(a){return a.sort(()=>Math.random()-.5)}function fx(ok){let e=document.getElementById('fx'),c=document.getElementById('fxc');e.className='effect '+(ok?'good':'badfx');c.textContent=ok?'✓':'×';void e.offsetWidth;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),850)}function answer(btn,ok){document.querySelectorAll('.opt').forEach(x=>x.disabled=true);let fb=document.getElementById('fb');if(ok){btn.classList.add('correct');let sec=Math.floor((Date.now()-startAt)/1000),gain=Math.max(300,1000-sec*5);score+=gain;document.getElementById('score').textContent=score;fb.className='feedback ok';fb.innerHTML='ACERTOU! +'+gain+' pontos.<br><small>'+Q[i][4]+'</small>';fx(true);document.getElementById('next').style.display='block'}else{btn.classList.add('wrong');mistakes++;score-=1000;document.getElementById('score').textContent=score;fb.className='feedback bad';fb.innerHTML='ERROU! −1.000 pontos.<br><small>'+Q[i][4]+'</small>';fx(false);document.querySelectorAll('.opt').forEach(x=>{if(x.textContent.includes(Q[i][3]))x.classList.add('correct')});document.getElementById('next').style.display='block'}}function finish(){clearInterval(timer);total=Math.floor((Date.now()-gameStart)/1000);players=players.filter(p=>p.name.toLowerCase()!==player.toLowerCase());players.push({name:player,score,time:total});players.sort((a,b)=>b.score-a.score||a.time-b.time);document.getElementById('ft').textContent=timefmt(total);document.getElementById('fm').textContent=mistakes;document.getElementById('fs').textContent=score+' pts';document.getElementById('winner').textContent=(players[0].name===player?'Você está em 1º lugar!':'1º lugar: '+players[0].name);document.getElementById('ranking').innerHTML='<div class="row"><b>#</b><b>Jogador</b><b>Pontos</b><b>Tempo</b></div>'+players.map((p,n)=>`<div class="row"><b>${n+1}º</b><span>${esc(p.name)}</span><span>${p.score}</span><span>${timefmt(p.time)}</span></div>`).join('');document.getElementById('fill').style.width='100%';screen('end')}function esc(s){return s.replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}let gameStart=0;document.getElementById('form').onsubmit=e=>{e.preventDefault();player=document.getElementById('name').value.trim().replace(/\s+/g,' ');if(!player)return;document.getElementById('player').textContent=player;i=0;score=0;mistakes=0;gameStart=Date.now();document.getElementById('score').textContent='0';screen('game');clearInterval(timer);timer=setInterval(()=>{total=Math.floor((Date.now()-gameStart)/1000);document.getElementById('time').textContent=timefmt(total)},1000);render()};document.getElementById('next').onclick=()=>{i++;i<Q.length?render():finish()};document.getElementById('again').onclick=()=>{document.getElementById('name').value='';document.getElementById('player').textContent='—';screen('start')};</script></body></html>
